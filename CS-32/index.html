<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Picker Tool | C-32 </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Color Picker</h1>
    <div class="picker-section">
      <div class="color-circle">
        <input type="color" id="colorInput" value="#4f8cff" aria-label="Pick a color" />
        <div class="color-ripple"></div>
      </div>
    </div>
    <div class="codes-container">
      <div class="code-section">
        <span class="code-label">HEX</span>
        <span id="hexCode">#4f8cff</span>
        <button class="copyBtn" title="Copy HEX code" data-target="hexCode">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" stroke="#fff" fill="none"/>
            <rect x="3" y="3" width="13" height="13" rx="2" stroke="#fff" fill="none"/>
          </svg>
        </button>
      </div>
      <div class="code-section">
        <span class="code-label">RGB</span>
        <span id="rgbCode">rgb(79, 140, 255)</span>
        <button class="copyBtn" title="Copy RGB code" data-target="rgbCode">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" stroke="#fff" fill="none"/>
            <rect x="3" y="3" width="13" height="13" rx="2" stroke="#fff" fill="none"/>
          </svg>
        </button>
      </div>
      <div class="code-section">
        <span class="code-label">HSL</span>
        <span id="hslCode">hsl(217, 100%, 65%)</span>
        <button class="copyBtn" title="Copy HSL code" data-target="hslCode">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" stroke="#fff" fill="none"/>
            <rect x="3" y="3" width="13" height="13" rx="2" stroke="#fff" fill="none"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="copiedMsg" class="copied-msg" hidden>Copied!</div>
    <div class="caption">by syntaxError</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
